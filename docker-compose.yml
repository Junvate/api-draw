services:
  app:
    image: draw-app:latest
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4173
      TRUST_PROXY: 1
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-}
      SESSION_SECRET: ${SESSION_SECRET:-replace-with-a-long-random-secret}
      DATABASE_URL: postgresql://${POSTGRES_USER:-draw}:${POSTGRES_PASSWORD:-draw}@postgres:5432/${POSTGRES_DB:-draw}?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-draw:}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-50}
      GATEWAY_QUEUE_LIMIT: ${GATEWAY_QUEUE_LIMIT:-5000}
      GATEWAY_FAILURE_THRESHOLD: ${GATEWAY_FAILURE_THRESHOLD:-30}
      GATEWAY_COOLDOWN_MS: ${GATEWAY_COOLDOWN_MS:-300000}
      GENERATION_IP_RPM: ${GENERATION_IP_RPM:-60}
      GENERATION_USER_RPM: ${GENERATION_USER_RPM:-30}
      GENERATION_API_KEY_RPM: ${GENERATION_API_KEY_RPM:-120}
      AUTH_IP_RPM: ${AUTH_IP_RPM:-20}
      AUTH_IDENTITY_RPM: ${AUTH_IDENTITY_RPM:-6}
      ADMIN_AUTH_IP_RPM: ${ADMIN_AUTH_IP_RPM:-10}
      ADMIN_AUTH_IDENTITY_RPM: ${ADMIN_AUTH_IDENTITY_RPM:-3}
      IMAGE_WORKER_CONCURRENCY: ${IMAGE_WORKER_CONCURRENCY:-200}
      IMAGE_JOB_ATTEMPTS: ${IMAGE_JOB_ATTEMPTS:-3}
      IMAGE_JOB_BACKOFF_MS: ${IMAGE_JOB_BACKOFF_MS:-5000}
      IMAGE_STALLED_TASK_MS: ${IMAGE_STALLED_TASK_MS:-600000}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-平台管理员}
      SEED_ADMIN_CREDITS: ${SEED_ADMIN_CREDITS:-1000}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      LOCAL_STORAGE_DIR: /app/storage
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    ports:
      - "127.0.0.1:${APP_PORT:-4173}:4173"
    volumes:
      - app-storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4173/api/ready >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-draw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-draw}
      POSTGRES_DB: ${POSTGRES_DB:-draw}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  app-storage:
  redis-data:
  postgres-data:
